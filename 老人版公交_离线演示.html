<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#FAFAF7"><title>公交到站</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#EFEFE9}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#FAFAF7;color:#1A1C1E;display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  max-width:420px;margin:0 auto;
}

.nav{flex-shrink:0;display:flex;align-items:baseline;gap:10px;padding:19px 20px 13px;background:#FAFAF7}
.back{
  font-size:16px;color:#5A6066;background:none;border:none;
  font-family:inherit;padding:2px 10px 2px 0;cursor:pointer;font-weight:600;
}
.nav .t{font-size:23px;font-weight:700;letter-spacing:-.4px}
.nav .r{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:15px;color:#8A8F94;font-weight:500;font-variant-numeric:tabular-nums;
}
.live{
  width:6px;height:6px;border-radius:50%;background:#1F9E5A;
  box-shadow:0 0 0 3px rgba(31,158,90,.14);flex-shrink:0;
}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 18px;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0;height:0;display:none}
.scroll.flush{padding:0 20px}
.scroll.home{display:flex;flex-direction:column;padding:0 16px 12px}

.card{
  background:#fff;border-radius:26px;padding:24px 22px 17px;
  border:1px solid #EAE9E2;
  box-shadow:0 1px 3px rgba(22,32,43,.04);
  cursor:pointer;position:relative;overflow:hidden;
}
.scroll.home .card{flex:1;min-height:0;display:flex;flex-direction:column}
.card.up,.card.dn{background:#fff}
.card.urgent{border-color:#F1CC9E}
.card.urgent::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#DA6B1C;
}

.ctop{display:flex;align-items:center;gap:9px}
.lineno{font-size:27px;font-weight:700;letter-spacing:-.4px;color:#0E3A63}
.lineno.up,.lineno.dn{color:#0E3A63}
.toward{
  font-size:14px;color:#5C6166;flex:1;min-width:0;
  white-space:normal;overflow-wrap:break-word;line-height:1.3;
}
.swapbtn{
  margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
  border:1px solid #DFE3E8;background:#fff;color:#3A4048;
  border-radius:999px;padding:8px 13px;
  font-size:13.5px;font-weight:600;font-family:inherit;
  cursor:pointer;line-height:1;white-space:nowrap;
}
.swapbtn .si{font-size:14px;color:#8A9199}
.swapbtn b{font-size:16px;font-weight:700;color:#0E3A63}
.card.up .swapbtn,.card.dn .swapbtn{color:#3A4048}

.cmid{margin-top:2px}
.main{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.min{
  font-size:96px;font-weight:800;line-height:.84;letter-spacing:-5px;
  color:#0E3A63;font-variant-numeric:tabular-nums;
}
.min.up,.min.dn{color:#0E3A63}
.unit{font-size:22px;font-weight:600;color:#0E3A63}
.unit.up,.unit.dn{color:#0E3A63}
.stxt{font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin-top:12px;color:#0E3A63}
.stxt.up,.stxt.dn{color:#0E3A63}
.sub{font-size:18px;color:#55595E;margin-top:10px}
.go{color:#C2410C;font-weight:700}

.swin{
  margin-top:16px;padding-top:6px;border-top:1px solid #F0EFE8;
  flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
}
/* 站点列表在固定高度里滚动，初始滚到「我」那一站。
   以前这里是 flex:1 把每行撑开，矮屏幕上整块会被压扁、内容溢出，
   压在卡片底部「看全部」那一行上 —— 连点击都被挡住。 */
.swscroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:6px;
}
.swscroll::-webkit-scrollbar{width:0;height:0;display:none}
/* 底部渐隐：最后一行被裁一半看起来像 bug，加层白雾就变成"下面还有"的暗示 */
.swin::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(to top,#fff 12%,rgba(255,255,255,0));
  pointer-events:none;
}
.swabove{font-size:13.5px;color:#9A6A2E;padding:4px 0 2px;flex-shrink:0}
.swrow{position:relative;display:flex;align-items:center;gap:10px;height:42px;flex-shrink:0;padding-left:25px}
.swrow::before{
  content:"";position:absolute;left:4px;top:0;bottom:0;
  width:1.5px;background:#DBDAD1;
}
.swrow:first-child::before{top:50%}
.swrow:last-child::before{bottom:50%}
.swrow .d{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:#fff;
  border:1.5px solid #CFCEC5;box-sizing:border-box;
}
.swrow.mine .d{border:none;background:#0E3A63;box-shadow:0 0 0 4px rgba(14,58,99,.10)}
.swrow.bus .d{border:none;background:#DA6B1C;box-shadow:0 0 0 4px rgba(218,107,28,.13)}
.swrow .n{
  font-size:17px;color:#3C4046;flex:0 1 auto;letter-spacing:-.1px;max-width:68%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.swrow::after{content:"";flex:1 1 0;height:0}
.swrow.mine .n{font-weight:700;color:#0E3A63}
.swrow .tb{
  font-size:11.5px;font-weight:700;color:#B4550E;background:#FDF0E3;
  border-radius:5px;padding:2px 6px;
}
.swrow .tm2{
  font-size:11.5px;font-weight:700;color:#0E3A63;background:#EAF1F8;
  border-radius:5px;padding:2px 6px;
}

/* ---- 选方向页：两个方向做成两张大卡，别让他去分辨上行下行 ---- */
.dhint{font-size:14.5px;color:#6B7076;padding:2px 4px 14px;line-height:1.5}
.dircard{
  background:#fff;border:1px solid #E9E8E1;border-radius:20px;
  padding:20px 42px 20px 22px;margin-bottom:13px;cursor:pointer;position:relative;
  box-shadow:0 1px 2px rgba(22,32,43,.04);
}
.dircard:active{background:#F6F6F0}
.dircard::after{
  content:"›";position:absolute;right:20px;top:50%;transform:translateY(-50%);
  font-size:22px;color:#D0D0C6;
}
.dtoward{font-size:14px;color:#8A8F94;font-weight:500;letter-spacing:.5px;flex-shrink:0}
.dto{
  display:flex;align-items:baseline;gap:7px;
  font-size:29px;font-weight:800;color:#0E3A63;letter-spacing:-.7px;
  margin-top:4px;line-height:1.22;
}
.dmeta{font-size:14px;color:#7A7F74;margin-top:9px;letter-spacing:.2px}
.dlive{margin-top:9px;display:flex;align-items:baseline;gap:9px}
.dmin{font-size:23px;font-weight:800;color:#C25E00;letter-spacing:-.5px}
.dst2{font-size:14.5px;color:#6B7076}
.dnum{font-size:15px;color:#6B7076}

/* 搜索结果里方向后面的站数，比站名淡一档，不抢「往哪」 */
.dstop{font-size:13px;color:#8A8F94;font-weight:400}

/* 导航栏右侧的文字按钮（站牌页「换站」） */
.navlink{
  margin-left:auto;font-size:15px;font-weight:600;color:#0E3A63;
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:10px 0 10px 12px;
}

.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;padding-top:13px;border-top:1px solid #F0EFE8;flex-shrink:0;position:relative;z-index:2}
.swall{
  font-size:15px;color:#0E3A63;font-weight:600;white-space:nowrap;
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:8px 2px 8px 0;margin:-8px 0;   /* 撑大点击热区，但不改变视觉高度 */
  display:inline-flex;align-items:center;gap:3px;
}
.swall:active{opacity:.6}

/* 到站提醒 */
.remlink{
  display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
  font-size:13.5px;font-weight:500;color:#9AA096;
  background:none;border:none;padding:5px 0;
  font-family:inherit;cursor:pointer;line-height:1.2;white-space:nowrap;
}
.remlink.on{color:#B45309;font-weight:600}
.remlink .ri{font-size:12px;opacity:.85}

.banner{
  position:fixed;top:0;left:0;right:0;max-width:420px;margin:0 auto;z-index:50;
  background:#FFF9F2;border-bottom:1.5px solid #F0D6B4;
  box-shadow:0 14px 34px -16px rgba(24,32,42,.45);
  padding:15px 16px;display:flex;align-items:center;gap:13px;
  transform:translateY(-115%);transition:transform .32s cubic-bezier(.2,.85,.3,1);
}
.banner.show{transform:translateY(0)}
.banner .btext{flex:1;min-width:0}
.banner .bt{font-size:22px;font-weight:800;color:#A8480B;line-height:1.15;letter-spacing:-.3px}
.banner .bs{font-size:15px;color:#3C4046;margin-top:3px}
.banner.hot{background:#FFF3E6;border-bottom-color:#F2BE85}
.banner .bx{
  flex-shrink:0;background:#A8480B;color:#fff;border:none;border-radius:11px;
  padding:13px 15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
}
.banner .bx:active{transform:scale(.97)}

.mask{
  position:fixed;inset:0;background:rgba(16,24,32,.40);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.mask.show{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;z-index:61;
  background:#fff;border-radius:24px 24px 0 0;padding:22px 18px 34px;
  transform:translateY(112%);transition:transform .3s cubic-bezier(.2,.85,.3,1);
  box-shadow:0 -12px 40px -20px rgba(24,32,42,.5);
}
.sheet.show{transform:translateY(0)}
.sheet h4{font-size:19px;font-weight:700;letter-spacing:-.2px}
.sheet .hint{font-size:16.5px;color:#1A1C1E;font-weight:600;line-height:1.5;margin-top:8px}
.opts{display:flex;gap:9px;margin:16px 0 12px}
.opt{
  flex:1;height:60px;border:1.5px solid #E2E1D9;border-radius:15px;background:#fff;
  font-size:16px;font-weight:600;font-family:inherit;color:#2A2E33;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.opt small{font-size:12.5px;font-weight:500;color:#6B7076}
.opt.sel{background:#0E3A63;border-color:#0E3A63;color:#fff}
.opt.sel small{color:rgba(255,255,255,.72)}
.sheet .limit{
  font-size:13.5px;color:#8A4B10;line-height:1.5;margin-top:12px;
  background:#FFF7EC;border-left:3px solid #E8A24A;border-radius:6px;
  padding:9px 11px;
}

.sheet .off{
  width:100%;height:54px;border:none;border-radius:14px;background:#F2F1EA;color:#5A5F55;
  font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
}

.sec{font-size:13px;color:#96998F;margin:16px 2px 6px;font-weight:500;letter-spacing:.2px}

.row{
  display:flex;align-items:center;gap:12px;
  padding:19px 2px;border-bottom:1px solid #EAE9E2;cursor:pointer;
}
.row:active{background:#F3F3ED}
.row .ln{
  font-size:22px;font-weight:700;color:#1A1C1E;min-width:84px;letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;
}
.row .dst{flex:1;font-size:15.5px;color:#6B7076;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{
  font-size:25px;font-weight:700;color:#0E3A63;text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.8px;
  min-width:68px;
}
.row .tm.hot{color:#C2410C;font-size:19px;letter-spacing:0}
.row .tm.wait{font-size:16px;font-weight:500;color:#9A9E96;letter-spacing:0}
.row .arrow{color:#CFCFC6;font-size:17px}
.row.first{border-top:none}
.srow .ln{min-width:auto;margin-right:2px}

.more{padding:22px 4px;font-size:16px;color:#0E3A63;cursor:pointer;font-weight:600}

.sbar{display:flex;gap:10px;padding:2px 16px 16px;flex-shrink:0}
.sinput{
  flex:1;height:56px;border:1px solid #DFDED6;border-radius:16px;
  padding:0 16px;font-size:20px;font-family:inherit;outline:none;
  background:#fff;color:#111;
}
.sinput:focus{border-color:#0E3A63;box-shadow:0 0 0 3px rgba(14,58,99,.08)}
.sbtn{
  width:80px;height:56px;border:none;border-radius:16px;background:#16202B;color:#fff;
  font-size:18px;font-weight:600;font-family:inherit;cursor:pointer;
}

.lhead{padding:2px 20px 14px;flex-shrink:0}
.lh1{display:flex;align-items:center;gap:12px}
.lh2{font-size:22px;font-weight:600;color:#1A1C1E;letter-spacing:-.2px}
.lh2 b{font-weight:700}
.swap{
  margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
  border:1px solid #DFE3E8;background:#fff;color:#0E3A63;
  border-radius:999px;padding:10px 16px;
  font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;line-height:1;
}
.lh3{font-size:13px;color:#96998F;margin-top:7px}
.noreal{
  background:#FDF6E7;color:#8A5A16;border-radius:10px;
  padding:10px 13px;font-size:13.5px;margin-top:11px;line-height:1.5;
}

.tl{position:relative;padding:8px 0 36px}
.stop{display:flex;align-items:center;gap:14px;padding:0 20px;height:60px;position:relative}
.stop::after{content:"";flex:1 1 0;height:0}
.stop .rail{position:absolute;left:36.25px;top:0;bottom:0;width:1.5px;background:#DBDAD0}
.stop:first-child .rail{top:50%}
.stop:last-child .rail{bottom:50%}
.dot{
  position:relative;z-index:1;width:12px;height:12px;border-radius:50%;
  background:#FAFAF7;border:1.5px solid #CFCEC5;flex:0 0 12px;margin-left:11px;
  box-sizing:border-box;
}
.dot.mine{border:none;background:#0E3A63;box-shadow:0 0 0 4px rgba(14,58,99,.16)}
.dot.bus{border:none;background:#DA6B1C;box-shadow:0 0 0 4px rgba(218,107,28,.17)}
.sname{
  font-size:20px;color:#2E3238;flex:0 1 auto;letter-spacing:-.2px;
  max-width:66%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sname.mine{font-weight:700;color:#0E3A63}
.tagme{font-size:12px;font-weight:700;color:#0E3A63;background:#EAF1F8;border-radius:5px;padding:3px 7px}
.tagbus{font-size:12px;font-weight:700;color:#B4550E;background:#FDF0E3;border-radius:5px;padding:3px 7px}
.stop.mine,.stop.busrow{background:transparent}
.busmeta{font-size:13px;color:#B0600E;margin-left:8px}

.btnrow{display:flex;gap:10px;padding:10px 16px 18px;flex-shrink:0}
.btn{
  flex:1;height:62px;border:none;border-radius:18px;font-size:18px;
  font-weight:600;font-family:inherit;cursor:pointer;
}
.btn.p{background:#16202B;color:#fff}
.btn.s{background:#EFEEE7;color:#2A2E33}
.btn.on{background:#0E3A63;color:#fff}
.tip{font-size:12.5px;color:#A0A49A;text-align:center;padding:10px 0 4px}
.loading{padding:64px 20px;text-align:center;font-size:18px;color:#8A8F84}
.err{background:#FDF0EE;border:1px solid #F0C4BC;border-radius:16px;padding:20px;margin:16px 4px}
.err h3{font-size:20px;color:#A33224;margin-bottom:8px}
.err p{font-size:15.5px;color:#55595E;line-height:1.55}

/* ==================================================================
   V2 覆盖层：只写与 V1 的差异，便于逐条对照
   维度：布局结构 / 视觉层级 / 交互流程 / 一致性 / 响应式 / 无障碍
   ================================================================== */

/* ---- 响应式：字号跟随屏宽，360 小屏不再挤 ---- */
.min{font-size:clamp(66px,25vw,96px);letter-spacing:-.055em;line-height:.84}
.unit{font-size:clamp(16px,4.6vw,22px);padding-bottom:.10em}
.stxt{font-size:clamp(34px,12.5vw,48px)}
.lineno{font-size:clamp(23px,6vw,27px)}

/* ---- 布局：卡片分区更清楚 ---- */
.scroll.home{padding:0 14px 12px}
.card{border-radius:24px;padding:22px 20px 16px}

/* ---- 视觉层级：数字区重排，「还有 X 站」进入同一信息组 ---- */
.sub{
  font-size:16px;color:#5C6157;margin-top:12px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.sub b{font-weight:700;color:#1A1C1E}
.go{margin-right:2px}

/* ---- 视觉层级：车位置提示降噪，改成列表的上下文而不是公告 ---- */
.swabove{
  display:flex;align-items:center;gap:7px;
  font-size:13.5px;color:#85897E;padding:0 0 9px;line-height:1.4;
}
.swabove::before{
  content:"";width:5px;height:5px;border-radius:50%;
  background:#C7CCBE;flex-shrink:0;
}

/* ---- 点站点看车多久到：选中行 + 顶部就地变成估算条 ---- */
.swrow{cursor:pointer}
.swrow[data-sel="1"]{background:#E8F0F7;border-radius:9px}
.swrow[data-sel="1"] .n{color:#0B4F8A;font-weight:700}
.swrow[data-sel="1"] .d{border-color:#0B4F8A}
.swabove.hot{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  background:#0E3A63;color:#fff;border-radius:11px;
  padding:9px 11px;margin:0 0 9px;font-size:14px;line-height:1.35;
}
.swabove.hot::before{display:none}
.swabove.hot .to{
  flex:1;min-width:0;font-weight:700;font-size:14.5px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.swabove.hot .t{font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.swabove.hot .x{color:rgba(255,255,255,.74);font-size:12.5px;flex-shrink:0}
.swabove.hot .bx{
  margin-left:auto;width:26px;height:26px;flex-shrink:0;padding:0;
  background:rgba(255,255,255,.18);border:0;border-radius:50%;
  color:#fff;font-size:16px;line-height:1;
}

/* ---- 交互：换方向更像按钮，不再像标签 ---- */
.swapbtn{
  border-color:#D5DAE1;color:#2F353C;
  box-shadow:0 1px 2px rgba(22,32,43,.06);
  padding:9px 13px;
}
.swapbtn:active{background:#F2F4F7}

/* ---- 交互 + 无障碍：响铃入口有足够触控高度和对比度 ---- */
.remlink{
  min-height:48px;padding:0;display:inline-flex;align-items:center;gap:5px;
  font-size:15px;font-weight:600;color:#0E3A63;
}
.remlink.on{color:#A8480B;font-weight:700}

/* ---- 一致性：三页导航同一套尺寸 ---- */
.nav{padding:18px 20px 12px;min-height:56px}
.back{padding:12px 12px 12px 0;margin:-12px 0}

/* ---- 站牌页：三列栅格，线路号/方向/时间严格对齐 ---- */
.row{
  display:grid;
  grid-template-columns:104px minmax(0,1fr) auto;
  align-items:center;column-gap:12px;
  padding:17px 2px;
}
.row .ln{min-width:0;font-size:20px;letter-spacing:-.3px}
.row .dst{min-width:0;font-size:15px;color:#6B7165}
.row .tm{min-width:54px;font-size:25px}
.row .arrow{display:none}
.srow{grid-template-columns:minmax(0,auto) minmax(0,1fr) auto}
.srow .ln{font-size:19px}

/* ---- 站牌页：底部两块间距收紧 ---- */
.more{padding:19px 2px;font-size:15.5px}
.tip{font-size:12.5px;color:#7A7F74;padding:8px 0 2px}

/* ---- 详情页：顶部信息与列表分开 ---- */
.lhead{padding:2px 20px 15px;border-bottom:1px solid #EFEEE7}
.lh2{font-size:19px;font-weight:500;color:#4A4F45}
.lh2 b{font-size:21px;font-weight:700;color:#0E3A63}
.lh3{font-size:12.5px;color:#7A7F74}
.swap{border-color:#D5DAE1;box-shadow:0 1px 2px rgba(22,32,43,.06)}

/* ---- 详情页：时间轴加深一档，长列表不糊 ---- */
.tl{padding:14px 0 32px}

.stop{height:58px}
.sname{font-size:19.5px}
.tagme{background:#E3EDF9;color:#0E3A63}

/* ---- 无障碍：灰字统一提到 4.5:1 以上 ---- */

.nav .r{color:#6E7368}
.tip{color:#7A7F74}
.cfoot{padding-top:12px}

/* ---- 无障碍：尊重系统的「减少动态效果」 ---- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---- 响应式：窄屏收一档，别把方向名截断成「浙南科…」 ---- */

}

/* ---- 响应式：极窄屏（320-359）再收一档 ---- */
@media (max-width:359px){
  .nav .t{font-size:21px}
  .row{grid-template-columns:92px minmax(0,1fr) auto}
  .row .ln{font-size:18px}
  .btn{font-size:16px;height:58px}
}

/* ---- 矮屏（老机型、或者浏览器地址栏占掉一大块）：把竖向空间抢回来给站点列表。

  .btn{height:58px}
}

function pad(n){return n<10?"0"+n:""+n}

/* ---------------------------------------------------------- 到站提醒 */
function remAt(){
  var v = parseInt(ls("remAt") || "0", 10);

}

function initAudio(){
  if(window._ac) return;
  try{

  }catch(e){}
}

/* 三声短促的提示音。用振荡器现场合成，不依赖任何音频文件 */
function beep(n){
  var ac = window._ac;
  if(!ac) return;
  try{
    if(ac.state === "suspended") ac.resume();
    var t0 = ac.currentTime + 0.02;
    for(var i = 0; i < n; i++){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(i % 2 ? 620 : 880, t0 + i * 0.40);
      g.gain.setValueAtTime(0.0001, t0 + i * 0.40);
      g.gain.exponentialRampToValueAtTime(0.45, t0 + i * 0.40 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.40 + 0.30);
      o.connect(g); g.connect(ac.destination);
      o.start(t0 + i * 0.40); o.stop(t0 + i * 0.40 + 0.32);
    }
  }catch(e){}
}

function buzz(p){
  try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){}
}

/* 当前配色：服务端渲染时写在 body 上，前端不用自己猜 */

/* 换配色：记进 cookie，然后重新进一次页面（不是 reload —— 要顺手清掉地址里的
   ?skin=，否则从对比链接进来的人换了色，刷新还是老配色，会以为没生效）。
   清完参数 hash 还在原地，老人换个颜色不会被弹回首页。 */
function setSkin(v){
  if(v === curSkin()){ closeSheet(); return; }
  /* 离线演示是单个 html 文件，没有服务端也没有 cookie，换不了色 —— 别让人点了没反应 */
  if(location.protocol === "file:"){
    closeSheet();
    showBanner("演示版换不了", "装到手机上就能换", false);
    setTimeout(hideBanner, 2600);
    return;
  }
  document.cookie = "sk=" + v + ";path=/;max-age=31536000;SameSite=Lax";
  location.replace(location.pathname + location.hash);
}

function closeSheet(){
  var m = document.getElementById("mask"), s = document.getElementById("sheet");
  if(m) m.classList.remove("show");
  if(s) s.classList.remove("show");
}

function pickAt(n){
  initAudio();
  beep(1);
  ls("remAt", String(n));
  _fired = {};
  closeSheet();
  viewHome();
  syncWatch();
  showBanner("响铃已开", "车还有 " + n + " 站时会响一声", false);
  setTimeout(hideBanner, 2800);
}

function turnOff(){

/* 每次轮询后检查。同一趟车只响一次，车走了再响下一趟 */
function checkRemind(main){
  var at = remAt();
  if(!at || !main) return;
  if(bridge()) return;   // App 里交给后台服务响，网页再响一次就成了两声
  var st = main.stations, k = main.dir || "1";

  if(st !== null && st > at){ delete _fired[k + "w"]; delete _fired[k + "n"]; }

  if(st !== null && st <= at && !_fired[k + "w"]){
    _fired[k + "w"] = 1;
    beep(3); buzz([280, 150, 280]);
    showBanner("车还有 " + st + " 站", "该出门了，往 " + (main.toShort || ""), false);
  }
  if((main.status === "here" || main.minutes === 0) && !_fired[k + "n"]){
    _fired[k + "n"] = 1; _fired[k + "w"] = 1;
    beep(4); buzz([300, 140, 300, 140, 300]);
    showBanner("车到站了", "快上车，往 " + (main.toShort || ""), true);
  }
}

/* --------------------------------------------------- 和 App（安卓壳）对接
   浏览器里没有 AndroidBridge，下面每个函数都静默跳过，网页行为一点不变。
   装成 App 之后，响铃由后台服务负责 —— 切出去、锁屏都还在看着。 */
var _watch = null;

function bridge(){
  return (typeof AndroidBridge !== "undefined" && AndroidBridge) ? AndroidBridge : null;
}

/* 把「现在在看哪条线、响几站」告诉 App。离开到站卡片就不动它：
   老人设好提醒往往直接按 Home 键，这时 _watch 还留着才是对的。 */
function syncWatch(){
  var B = bridge(); if(!B) return;
  try{
    if(!_watch){ B.setWatch("", "", "", 0); return; }
    B.setWatch(_watch.line, _watch.dir, _watch.station, remAt());
  }catch(e){}
}

function go(hash){
  if(location.hash === hash){ route(); } else { location.hash = hash; }
}

/* 一个站有哪些车：每行 = 一条线的一个方向。首页和站牌页共用这一份。
   点进去就是那张到站卡片，方向已经在行上选好了。 */
function stationRows(lines, station, limit){
  limit = limit || 6;
  var h = "";
  for(var i = 0; i < lines.length; i++){
    var v = lines[i];
    var hidden = i >= limit;
    var tm = "", tcls = "";
    if(v.status === "coming" && v.minutes !== null){
      tm = (v.minutes === 0 ? "马上到" : v.minutes + "′");
      if(v.minutes <= 2){ tcls = "hot"; }
    }
    else if(v.status === "here"){ tm = "在站上"; tcls = "hot"; }
    else if(v.status === "waiting"){ tm = "等发车"; tcls = "wait"; }
    else if(v.status === "closed"){ tm = "收班"; tcls = "wait"; }
    else { tm = "—"; tcls = "wait"; }

    var href = '#/b/' + encodeURIComponent(v.line) + '/' + v.dir
             + '?st=' + encodeURIComponent(station);
    h += '<div class="row' + (i === 0 ? " first" : "") + '" '
       + (hidden ? 'style="display:none"' : '') + ' data-late="' + (hidden ? 1 : 0) + '" '
       + 'onclick="go(\'' + href + '\')">'
       + '<span class="ln">' + esc(v.line) + '</span>'
       + '<span class="dst">往 ' + esc(v.toShort) + '</span>'
       + '<span class="tm ' + tcls + '">' + tm + '</span>'
       + '<span class="arrow">›</span></div>';
  }
  return h;
}

/* 首页 = 附近站牌 + 搜索。这里只负责选「哪条线哪个方向」，
   具体的到站大卡片在 #/b/线路/方向 那一页。 */
function viewHome(){
  var el = document.getElementById("app");
  el.innerHTML = '<div class="loading">正在查这站有哪些车…</div>';
  api("/api/home").then(function(p){
    if(!p.ok){ el.innerHTML = errBox("查不到", p.error); return; }
    var lines = p.lines || [];
    if(!lines.length){ el.innerHTML = errBox("这个站没有线路", "换个站试试"); return; }

    var html = '<div class="nav"><span class="t">'+esc(p.station)+'站</span>'
             + '<button class="setlink" onclick="openSheet()">设置</button>'
             + '<span class="r" id="clock"><i class="live"></i>'+p.updated+'</span></div>';

    html += '<div class="sbar">'
          + '<input id="hkw" class="sinput" type="search" inputmode="search" '
          + 'placeholder="搜线路号或站名" '
          + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();homeSearch();}">'
          + '<button class="sbtn" onclick="homeSearch()">搜</button></div>';

    html += '<div class="scroll flush">';
    html += '<div class="sec" style="padding:12px 16px 6px">附近站牌 · 有车的在前</div>';
    html += '<div id="lst">' + stationRows(lines, p.station) + '</div>';
    if(lines.length > 6){
      html += '<div class="more" id="more" onclick="showMore()">还有 '
            + (lines.length - 6) + ' 条线，点这里看 ›</div>';
    }
    if(lines.length <= 3){
      html += '<div class="tip" style="padding:26px 16px 10px">这站就这几趟车。'
            + '想查别的线路，用上面的搜索框</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }).catch(function(){ el.innerHTML = errBox("连不上", "检查电脑上的程序是否还在运行"); });
}

function homeSearch(){
  var v = (document.getElementById("hkw").value || "").trim();
  if(!v) return;
  go('#/search?kw=' + encodeURIComponent(v));
}

/* 到站卡片：一条线一个方向，就是原来首页那张卡，现在可以装任意线路 */
function viewBoard(line, dir, station){

  // 换了线路或方向，上一次选中的站就不作数了；同一条线刷新则保留

             + '<span class="r"><i class="live"></i>'+p.updated+'</span></div>';
    html += '<div class="scroll home">';

          + '<button class="btn s" onclick="go(\'#/s/\'+encodeURIComponent(p.station))">这站的车</button>'
          + '<button class="btn p" onclick="toggleSpeak()">'+(speakOn?"念 ✓":"念一遍")+'</button>'
          + '</div>';
    el.innerHTML = html;

    centerMyStop();
    restorePick();

/* 把站点列表滚到合适的位置：
   - 车在我上方 5 站以内 → 连车那行一起带进视野，老人真正想知道的是车开到哪了
   - 车更远或已经过站 → 以「你在这」为锚，上方留一行半
   用 getBoundingClientRect 算，不用 offsetTop —— offsetParent 会算错。 */
function centerMyStop(){
  var box = document.getElementById("swscroll");
  if(!box) return;
  var me = box.querySelector(".swrow.mine");

  // 这条线不经过我的站：没有「你在这」，就把视野滚到最近一辆车那儿
  if(!me){
    var anyBus = box.querySelector(".swrow.bus");
    if(anyBus){
      var d0 = anyBus.getBoundingClientRect().top - box.getBoundingClientRect().top;
      box.scrollTop = Math.max(0, box.scrollTop + d0 - box.clientHeight * 0.30);
    }
    return;
  }

  var rowH = me.offsetHeight || 42;
  var anchor = me, pad = rowH * 1.5;
  var busRow = box.querySelector(".swrow.bus");
  if(busRow){
    var gap = me.getBoundingClientRect().top - busRow.getBoundingClientRect().top;
    if(gap > 0 && gap <= rowH * 5.5){ anchor = busRow; pad = rowH * 0.5; }
  }

  var delta = anchor.getBoundingClientRect().top - box.getBoundingClientRect().top;
  var target = box.scrollTop + delta - pad;
  // 对齐到整行：不对齐的话首行会卡在框边被切掉一半，看起来像和上面那行叠在一起
  target = Math.round(target / rowH) * rowH;
  box.scrollTop = Math.max(0, Math.min(target, box.scrollHeight - box.clientHeight));
}

/* 读屏用的整句描述：把一张卡的信息压成一句话 */
function ariaText(m, station){
  var t = m.line + " 往 " + (m.toShort || "");
  if(m.status === "noroute") t += "，这条线不经过" + (station || "这") + "站";
  else if(m.status === "here") t += "，车已经到站";
  else if(m.status === "coming" && m.minutes !== null){
    t += "，还有 " + m.minutes + " 分钟";
    if(m.stations !== null) t += "，" + m.stations + " 站";
  }
  else if(m.status === "waiting") t += "，等待发车";
  else if(m.status === "closed") t += "，已经收班";
  else t += "，暂时没有车";
  return t;
}

function mainSpeech(main, other){
  var t = "往"+main.toShort+"，";
  if(main.status==="noroute") t += "这条线不经过这站";
  else if(main.status==="here") t += "车在站上";
  else if(main.status==="coming" && main.minutes!==null) t += (main.minutes===0?"车马上到":"还有"+main.minutes+"分钟");
  else if(main.status==="waiting") t += "等发车";
  else if(main.status==="closed") t += "已收班";
  else t += "暂无车";
  if(other){
    t += "。反方向";
    if(other.status==="coming" && other.minutes!==null) t += (other.minutes===0?"车马上到":"还有"+other.minutes+"分钟");
    else if(other.status==="closed") t += "已收班";
    else t += "暂无车";
  }
  return t;
}

/* ---------------------------------------------- 点站点，看车多久到
   只改显示：不发请求、不动主数字、不新增块 —— 顶部「车现在在 X」那行就地变成估算，
   列表高度不变，所以不会跳。老人误触也就是多出一行，点 × 就回去了。 */
var _picked = null;      // {i, line, dir}：卡片每 15 秒重画一次，选中要能活过刷新

function pickStop(el){
  if(!el) return;
  var box = document.getElementById("swscroll");
  if(!box) return;

  var on = el.getAttribute("data-sel") === "1";
  var rows = box.querySelectorAll(".swrow");
  for(var i = 0; i < rows.length; i++){
    rows[i].removeAttribute("data-sel");
    rows[i].className = rows[i].className.replace(" sel", "");
  }
  if(on){ _picked = null; fillEta(null); return; }    // 再点一次就取消

  var r = rowOf(el);
  if(!r) return;
  _picked = {i: r.i, key: window._winKey || ""};
  el.setAttribute("data-sel", "1");
  el.className += " sel";
  fillEta(el);        // 先用本地算的，立刻有数
  etaFetch(el);       // 再问一次这一站，用真实到站覆盖
}

/* 问上游这一站的实时到站。点得快时只认最后一次，旧响应直接丢掉 */
var _etaSeq = 0;

function etaFetch(el){
  var r = rowOf(el);
  if(!r || !window._winKey) return;
  if(r.mine) return;                       // 就是我这站，主数字已经准了
  if(window.__DATA__) return;              // 离线演示页没有接口，用本地估算就够了
  var parts = window._winKey.split("/");
  var seq = ++_etaSeq;

  api("/api/eta?line=" + encodeURIComponent(parts[0])
      + "&dir=" + encodeURIComponent(parts[1])
      + "&station=" + encodeURIComponent(r.name))
  .then(function(p){
    if(seq !== _etaSeq) return;            // 已经点了别的站
    if(!p || !p.ok){
      r.status = "noroute";
      if(el.getAttribute("data-sel") === "1") fillEta(el);
      return;
    }
    r.status = p.status;
    r.eta = p.minutes;
    r.left = p.stations;
    r.passed = (p.status === "passed");
    if(el.getAttribute("data-sel") === "1") fillEta(el);
  })
  .catch(function(){});
}

function rowOf(el){
  var i = parseInt(el.getAttribute("data-i"), 10);
  var rows = (window._win && window._win.rows) || [];
  for(var k = 0; k < rows.length; k++){
    if(rows[k].i === i) return rows[k];
  }
  return null;
}

function fillEta(el){
  var bar = document.getElementById("swabove");
  if(!bar) return;

  if(!el){
    bar.className = "swabove";
    bar.innerHTML = (window._win && window._win.busHere)
      ? '车现在在 ' + esc(window._win.busHere) + ' · 点站点看多久到'
      : '点站点看车多久到';
    return;
  }

  var r = rowOf(el);
  if(!r) return;

  /* 上游的 status 优先于本地的「已过站」判断 —— 本地说的是当前这班车开过去了，
     上游回答的是「最近一班什么时候到这一站」，后者才是老人问的事。 */
  var st = r.status || "";
  var tail;
  if(st === "passed"){
    tail = '<b class="t">车已过站</b><span class="x">等下一班</span>';
  } else if(st === "closed"){
    tail = '<b class="t">今天收班了</b><span class="x">明天再来</span>';
  } else if(st === "waiting"){
    tail = '<b class="t">车还没发车</b><span class="x">等发车</span>';
  } else if(st === "here"){
    tail = '<b class="t">车在站上</b><span class="x">快上车</span>';
  } else if(st === "noroute"){
    tail = '<b class="t">查不到</b><span class="x">这站没车</span>';
  } else if(r.passed){
    tail = '<b class="t">车已过站</b><span class="x">等下一班</span>';
  } else if(r.eta !== null && r.eta !== undefined){
    tail = '<b class="t">约 ' + r.eta + ' 分钟</b><span class="x">· ' + r.left + ' 站</span>';
  } else if(r.left !== null && r.left !== undefined){
    tail = '<b class="t">还有 ' + r.left + ' 站</b><span class="x">无实时车</span>';
  } else {
    tail = '<b class="t">正在查…</b><span class="x">马上好</span>';
  }

  bar.className = "swabove hot";
  bar.innerHTML = '<span class="to">到 ' + esc(r.name) + '</span>' + tail
                + '<button class="bx" onclick="clearStop(event)" aria-label="取消选中">×</button>';
}

function clearStop(e){
  if(e && e.stopPropagation) e.stopPropagation();
  _picked = null;
  var box = document.getElementById("swscroll");
  if(box){
    var s = box.querySelector('.swrow[data-sel="1"]');
    if(s){ s.className = s.className.replace(" sel", ""); s.removeAttribute("data-sel"); }
  }
  fillEta(null);
}

/* 刷新后把选中接回来，并把视野停在那一站，别让老人重新找 */
function restorePick(){
  if(!_picked) return;
  var box = document.getElementById("swscroll");
  if(!box) return;
  var el = box.querySelector('.swrow[data-i="' + _picked.i + '"]');
  if(!el) return;
  el.setAttribute("data-sel", "1");
  el.className += " sel";
  fillEta(el);
  etaFetch(el);       // 15 秒刷新过一轮，这一站的数也要重问

  var rowH = el.offsetHeight || 42;
  var delta = el.getBoundingClientRect().top - box.getBoundingClientRect().top;
  var target = box.scrollTop + delta - box.clientHeight * 0.4;
  box.scrollTop = Math.max(0, Math.min(Math.round(target / rowH) * rowH,
                                       box.scrollHeight - box.clientHeight));
}

function homeCard(main, other, win, station){
  station = station || HOME_STATION;
  var cls = main.dir==="1" ? "up" : "dn";
  var urgent = (main.status==="coming" && main.minutes!==null && main.minutes<=3);
  var h = '<div class="card '+cls+(urgent?' urgent':'')+'">';

  var swapHtml = "";
  if(other){
    var otxt = "暂无车";
    if(other.status==="coming" && other.minutes!==null){
      otxt = (other.minutes===0?"马上到":other.minutes+"分");
    } else if(other.status==="here"){ otxt = "在站上"; }
    else if(other.status==="waiting"){ otxt = "等发车"; }
    else if(other.status==="closed"){ otxt = "已收班"; }
    // 只写动作，不写反方向的终点和分钟 —— 宽度留给「往 XX」，
    // 不然像「往 浙江东方学院」这种长站名会被拆成「…学」「院」两行
    swapHtml = '<button class="swapbtn" aria-label="换到往' + esc(other.toShort) + '的方向，' + otxt + '" '
             + 'onclick="swapDir(\'' + other.dir + '\',\'' + esc(main.line) + '\',\'' + esc(station) + '\')">'
             + '<span class="si">⇄</span> 换方向</button>';
  }

  h += '<div class="ctop"><span class="lineno '+cls+'">'+esc(main.line)+'</span>'
     + '<span class="toward">往 '+esc(main.toShort)+'</span>'
     + swapHtml + '</div>';

  h += '<div class="cmid" role="img" aria-label="' + esc(ariaText(main, station)) + '">';
  if(main.status==="noroute"){
    h += '<div class="stxt '+cls+'" style="font-size:30px;line-height:1.25">不经过 '+esc(station)+'站</div>'
       + '<div class="sub">下面是全程站点和车开到哪了</div>';
  } else if(main.status==="here"){
    h += '<div class="stxt '+cls+'">车在站上</div><div class="sub">快上车</div>';
  } else if(main.status==="coming" && main.minutes!==null){
    if(main.minutes===0){
      h += '<div class="stxt '+cls+'">马上到</div><div class="sub"><b class="go">快上车</b>车就在附近</div>';
    } else {
      h += '<div class="main"><span class="min '+cls+'">'+main.minutes+'</span>'
         + '<span class="unit '+cls+'">分钟</span></div>'
         + '<div class="sub">'+(urgent?'<b class="go">该出门了</b> · ':'')
         + '还有 <b>'+(main.stations!==null?main.stations+" 站":"几站")+'</b></div>';
    }
  } else if(main.status==="waiting"){
    h += '<div class="stxt '+cls+'">等发车</div><div class="sub">'+esc(main.dist)+'</div>';
  } else if(main.status==="closed"){
    h += '<div class="stxt '+cls+'">已收班</div><div class="sub">明天再来</div>';
  } else {
    h += '<div class="stxt '+cls+'">'+esc(main.node||"暂无车")+'</div>';
  }
  h += '</div>';

    if(win && win.rows && win.rows.length){
    h += '<div class="swin">';
    h += '<div class="swabove" id="swabove">'
       + (win.busHere ? '车现在在 '+esc(win.busHere)+' · 点站点看多久到' : '点站点看车多久到')
       + '</div>';
    h += '<div class="swscroll" id="swscroll">';
    for(var wi = 0; wi < win.rows.length; wi++){
      var r = win.rows[wi];
      h += '<div class="swrow' + (r.mine ? ' mine' : '') + (r.bus ? ' bus' : '') + '"'
         + ' data-i="' + r.i + '" onclick="pickStop(this)">'
         + '<span class="d"></span>'
         + '<span class="n">' + esc(r.name) + '</span>'
         + (r.mine ? '<span class="tm2">你在这</span>' : '')
         + (r.bus ? '<span class="tb">车</span>' : '')
         + '</div>';
    }
    h += '</div></div>';
    window._win = win;
    window._winKey = main.line + "/" + main.dir;
  }

  var remTxt = remAt() ? ('响铃中 · ' + remAt() + ' 站') : '到站响铃';
  var remCls = remAt() ? 'remlink on' : 'remlink';
  var remHtml = '<button class="' + remCls + '" aria-pressed="' + (remAt() ? 'true' : 'false')
              + '" onclick="openSheet()">'
              + remTxt + '</button>';
  h += '<div class="cfoot"><span>' + (win ? '全程 ' + win.total + ' 站' : '') + '</span>' + remHtml + '</div>';
  h += '</div>';
  return h;
}

/* 换反方向：换的是同一张卡片的方向，不是回首页重新选。
   用 replace 不新增历史 —— 否则连点几次换方向，返回要按好几下才回得到首页。 */
function swapDir(d, line, station){
  ls("prefDir", d);
  if(line){
    location.replace('#/b/' + encodeURIComponent(line) + '/' + d
      + '?st=' + encodeURIComponent(station || HOME_STATION));
  } else {
    viewHome();
  }
}

function toggleSpeak(){
  speakOn = !speakOn;
  var b = document.getElementById("spk");
  if(b){ b.textContent = speakOn?"自动念 ✓":"念一遍"; b.className = "btn "+(speakOn?"on":"p"); }
  if(speakOn && window._speech){ speak(window._speech); }
}

function errBox(t, m){
  return '<div class="err"><h3>'+esc(t)+'</h3><p>'+esc(m||"稍后再试")+'</p></div>';
}

function viewStation(name){
  var el = document.getElementById("app");
  el.innerHTML = '<div class="nav"><button class="back" onclick="back()">‹ 返回</button>'
    + '<span class="t">'+esc(name)+'</span></div><div class="scroll"><div class="loading">正在查…</div></div>';
  api("/api/station?name="+encodeURIComponent(name)).then(function(p){
    if(!p.ok){ el.innerHTML = errBox("查不到这个站", p.error); return; }
    var lines = p.lines || [];
    if(!lines.length){ el.innerHTML = errBox("这个站没有线路", "换个站试试"); return; }

    var LIMIT = 6;
    var html = '<div class="nav"><button class="back" onclick="back()">‹ 返回</button>'
             + '<span class="t">'+esc(p.station)+'</span>'
             + '<button class="navlink" onclick="go(\'#/search\')">换站 ›</button></div>';

    html += '<div class="scroll flush"><div class="sec" style="padding:12px 16px 6px">'
          + '有车的排在前面</div>';
    html += '<div id="lst">';
    html += '<div id="lst">' + stationRows(lines, name, LIMIT) + '</div>';
    if(lines.length > LIMIT){
      html += '<div class="more" id="more" onclick="showMore()">还有 '+(lines.length-LIMIT)+' 条线，点这里看 ›</div>';
    }
    html += '<div class="tip">更新于 '+p.updated+'</div></div>';
    el.innerHTML = html;
  }).catch(function(){ el.innerHTML = errBox("连不上", "稍后再试"); });
}

function showMore(){
  var rows = document.querySelectorAll('[data-late="1"]');
  for(var i=0;i<rows.length;i++){ rows[i].style.display="flex"; }
  var m = document.getElementById("more");
  if(m) m.style.display="none";
}

function viewSearch(kwArg){
  var el = document.getElementById("app");
  if(kwArg) window._kw = kwArg;
  var kw = window._kw || "";
  el.innerHTML = '<div class="nav"><button class="back" onclick="back()">‹ 返回</button>'
    + '<span class="t">查线路</span></div>'
    + '<div class="sbar"><input id="kw" class="sinput" type="search" inputmode="search" '
    + 'placeholder="输线路号，比如 36" value="' + esc(kw) + '" '
    + 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();doSearch();}">'
    + '<button class="sbtn" onclick="doSearch()">搜</button></div>'
    + '<div class="scroll" id="sres"></div>';
  if(kw){ doSearch(); }
  else {
    document.getElementById("sres").innerHTML =
      '<div class="panel"><div class="sec">输线路号或站名，比如 36、159、石坦</div></div>';
  }
  var inp = document.getElementById("kw");
  if(inp && !kw){ setTimeout(function(){ inp.focus(); }, 120); }
}

function doSearch(){
  var kw = (document.getElementById("kw").value || "").trim();
  if(!kw) return;
  window._kw = kw;
  var box = document.getElementById("sres");
  box.innerHTML = '<div class="loading">正在搜…</div>';
  api("/api/search?kw=" + encodeURIComponent(kw)).then(function(p){
    if(!p.ok){ box.innerHTML = errBox("搜不了", p.error); return; }
    var h = "";
    var lines = p.lines || [], stations = p.stations || [];
    if(lines.length){
      var lt = p.linesTotal || lines.length;
      h += '<div class="sec">线路 ' + (lt > lines.length ? lines.length + ' / 共 ' + lt + ' 条' : lines.length + ' 条') + '</div>';
      for(var i = 0; i < lines.length; i++){
        var v = lines[i];
        if(v.dirs && v.dirs.length > 1){
          // 线路号精确命中的，两个方向直接摊开 —— 点了就是那张到站卡片
          for(var j = 0; j < v.dirs.length; j++){
            var dd = v.dirs[j];
            var hr = '#/b/' + encodeURIComponent(v.line) + '/' + dd.dir;
            h += '<div class="row srow" onclick="go(\'' + hr + '\')">'
               + '<span class="ln">' + esc(v.line) + '</span>'
               + '<span class="dst">往 ' + esc(dd.toShort)
               + '　<span class="dstop">' + dd.stopCount + ' 站</span></span>'
               + '<span class="arrow">›</span></div>';
          }
        } else {
          // 同名的其他线路：只列一行，点进去再选方向
          var href = '#/d/' + encodeURIComponent(v.line);
          h += '<div class="row srow" onclick="go(\'' + href + '\')">'
             + '<span class="ln">' + esc(v.line) + '</span>'
             + '<span class="dst">' + esc(v.from) + ' → ' + esc(v.to) + '</span>'
             + '<span class="arrow">›</span></div>';
        }
      }
    }
    if(stations.length){
      var st = p.stationsTotal || stations.length;
      h += '<div class="sec">站点 ' + (st > stations.length ? stations.length + ' / 共 ' + st + ' 个' : stations.length + ' 个') + '</div>';
      for(var j = 0; j < stations.length; j++){
        var s = stations[j];
        var sh = '#/s/' + encodeURIComponent(s.name);
        h += '<div class="row" onclick="go(\'' + sh + '\')">'
           + '<span class="ln" style="font-size:19px;min-width:auto;flex:1">'
           + esc(s.name) + '</span><span class="arrow">›</span></div>';
      }
    }
    if(p.skipped){
      h += '<div class="sec">另有 ' + p.skipped + ' 条线路没有实时到站数据，已隐藏</div>';
    }
    if((p.linesTotal || 0) > lines.length || (p.stationsTotal || 0) > stations.length){
      h += '<div class="sec">结果比较多，只列出最相近的几条。把线路号或站名输完整一些更准</div>';
    }
    if(!h){
      h = '<div class="sec">没搜到。站名要写全 —— '
        + '比如温州不叫「火车站」，叫「火车温州站」</div>';
    }
    box.innerHTML = '<div class="panel">' + h + '</div>';
  }).catch(function(){ box.innerHTML = errBox("连不上", "稍后再试"); });
}

/* 返回：优先回上一页，没有上一页才回首页。
   以前一律回首页，从站牌页点进来再返回就丢了原来的站位。 */
function back(){
  if(history.length > 1){ history.back(); }
  else { go('#/'); }
}

/* 选方向 —— 只有「知道坐几路、不知道往哪边开」的时候才走这一页。
   从站牌页点进来的人，那一行本来就写了「往 浙南科技城 还有 3 分钟」，
   方向已经选完了，不会再经过这里。 */
function viewDirs(line, from){
  var el = document.getElementById("app");
  el.innerHTML = '<div class="loading">正在查这条线…</div>';
  api("/api/dirs?line=" + encodeURIComponent(line) + "&from=" + encodeURIComponent(from||""))
  .then(function(p){
    if(!p.ok || !p.dirs || !p.dirs.length){
      el.innerHTML = errBox("查不到这条线", p.error || "换个线路号试试"); return;
    }

    // 环线之类只有一个方向，就别让他白选一次
    if(p.dirs.length === 1){
      go('#/l/' + encodeURIComponent(p.line) + '/' + p.dirs[0].dir
         + '?f=' + encodeURIComponent(from||""));
      return;
    }

    var html = '<div class="nav"><button class="back" onclick="back()">‹ 返回</button>'
             + '<span class="t">'+esc(p.line)+'</span></div>';

    html += '<div class="scroll">';
    html += '<div class="dhint">'
          + (from ? '从'+esc(from)+'上车，选往哪边开' : '选往哪边开')
          + '</div>';

    for(var i=0;i<p.dirs.length;i++){
      var v = p.dirs[i];
      var href = '#/l/' + encodeURIComponent(p.line) + '/' + v.dir
               + '?f=' + encodeURIComponent(from||"");
      var live = "";
      if(v.minutes !== null && v.minutes !== undefined){
        live = '<span class="dmin">' + (v.minutes === 0 ? "马上到" : v.minutes + " 分钟") + '</span>';
        if(v.stations) live += '<span class="dst2">还有 ' + v.stations + ' 站</span>';
      } else if(v.busCount){
        live = '<span class="dnum">' + v.busCount + ' 辆车在路上</span>';
      } else if(!v.hasReal){
        live = '<span class="dnum">这条线没有实时数据</span>';
      }

      html += '<div class="dircard" onclick="go(\''+href+'\')">'
            + '<div class="dto"><span class="dtoward">往</span>'+esc(v.toShort)+'</div>'
            + '<div class="dmeta">共 '+v.stopCount+' 站'
            + (v.begin ? '　'+esc(v.begin)+'–'+esc(v.end) : '') + '</div>'
            + (live ? '<div class="dlive">'+live+'</div>' : '')
            + '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }).catch(function(){ el.innerHTML = errBox("连不上", "检查电脑上的程序是否还在运行"); });
}

function viewLine(line, dir, focus){
  var el = document.getElementById("app");
  el.innerHTML = '<div class="loading">正在查线路…</div>';
  api("/api/line?name="+encodeURIComponent(line)+"&dir="+dir+"&focus="+encodeURIComponent(focus||""))
  .then(function(p){
    if(!p.ok || !p.stops || !p.stops.length){
      el.innerHTML = errBox("查不到这条线", p.error); return;
    }
    var other = dir==="1" ? "2" : "1";
    var stopMap = {};
    for(var i=0;i<p.buses.length;i++){
      if(p.focus && p.buses[i].index >= p.focus) continue;
      stopMap[p.buses[i].index] = p.buses[i];
    }

    var hrefSwap = '#/l/' + encodeURIComponent(p.line) + '/' + other + '?f=' + encodeURIComponent(focus||"");
    var meta = [];
    if(p.begin) meta.push('首班 ' + p.begin);
    if(p.end) meta.push('末班 ' + p.end);
    meta.push('共 ' + p.stops.length + ' 站');

    var html = '<div class="nav"><button class="back" onclick="back()">‹ 返回</button>'
             + '<span class="t">'+esc(p.line)+'</span></div>';

    html += '<div class="lhead"><div class="lh1">'
          + '<div class="lh2">往 <b>'+esc(p.toShort)+'</b></div>'
          + '<button class="swap" onclick="go(\''+hrefSwap+'\')">⇄ 换个方向</button></div>'
          + '<div class="lh3">'+esc(meta.join('　'))+'</div>'
          + (p.hasReal ? '' : '<div class="noreal">这条线没有实时到站数据，只能看站点顺序</div>')
          + '</div>';

    html += '<div class="scroll flush">';
    html += '<div class="tl">';
    for(var i=0;i<p.stops.length;i++){
      var s = p.stops[i];
      var mine = (p.focus && s.i === p.focus);
      var bus = stopMap[s.i];
      var dotcls = "dot" + (mine?" mine":"") + (bus?" bus":"");
      var rowcls = "stop" + (mine?" mine":"") + (bus?" busrow":"");
      html += '<div class="'+rowcls+'" id="s'+s.i+'">'
            + '<div class="rail"></div>'
            + '<div class="'+dotcls+'"></div>'
            + '<div class="sname'+(mine?" mine":"")+'">'+esc(s.name)+'</div>';
      if(mine) html += '<span class="tagme">你在这</span>';
      if(bus)  html += '<span class="tagbus">车</span>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="tip">更新于 '+p.updated+'　'
          + (p.hasReal ? ('在途 '+p.buses.length+' 辆') : '暂无实时数据') + '</div>';
    html += '</div>';
    el.innerHTML = html;

    if(p.focus){
      var node = document.getElementById("s"+p.focus);
      if(node){
        setTimeout(function(){
          var sc = el.querySelector(".scroll");
          var top = node.offsetTop - sc.clientHeight/2 + node.offsetHeight/2;
          sc.scrollTop = Math.max(0, top);
        }, 60);
      }
    }
  }).catch(function(){ el.innerHTML = errBox("连不上", "稍后再试"); });
}

function route(){
  var h = location.hash || "#/";
  var el = document.getElementById("app");
  if(timer){ clearInterval(timer); timer = null; }

  var q = "";
  var qi = h.indexOf("?");
  if(qi >= 0){ q = h.slice(qi+1); h = h.slice(0,qi); }
  var params = {};
  q.split("&").forEach(function(kv){
    if(!kv) return; var a = kv.split("=");
    params[decodeURIComponent(a[0])] = decodeURIComponent(a[1]||"");
  });

  var parts = h.replace(/^#\/?/, "").split("/");

  if(parts[0] === "" ){ viewHome(); timer = setInterval(viewHome, 20000); return; }
  if(parts[0] === "s"){ viewStation(decodeURIComponent(parts[1]||"")); timer = setInterval(function(){ viewStation(decodeURIComponent(parts[1]||"")); }, 20000); return; }
  if(parts[0] === "b"){
    var bl = decodeURIComponent(parts[1]||""), bd = parts[2]||"1", bs = params.st||"";
    viewBoard(bl, bd, bs);
    timer = setInterval(function(){ viewBoard(bl, bd, bs); }, 15000);
    return;
  }
  if(parts[0] === "d"){ viewDirs(decodeURIComponent(parts[1]||""), params.from || ""); return; }
  if(parts[0] === "l"){ viewLine(decodeURIComponent(parts[1]||""), parts[2]||"1", params.f||""); return; }
  if(parts[0] === "search"){ viewSearch(params.kw || ""); return; }

  viewHome();
}

/* 调试用：地址加 ?sheet=1 直接弹出设置面板，方便截图核对。
   ?sheet=now 连滑入动画一起去掉 —— 无头浏览器截图会卡在动画中间。 */
if(location.search.indexOf("sheet=") >= 0){
  setTimeout(function(){
    try{
      if(location.search.indexOf("sheet=now") >= 0){
        var sh = document.getElementById("sheet");
        if(sh) sh.style.transition = "none";
      }
      openSheet();
    }catch(e){}
  }, 2600);
}

/* 调试用：地址加 ?pick=站序 自动选中那一站，方便截图核对估算条
   （只点一次 —— pickStop 是开关，点两下就取消了） */
(function(){
  var m = location.search.match(/[?&]pick=(\d+)/);
  if(!m) return;
  var hit = false;
  var t = setInterval(function(){
    if(hit) return;
    var row = document.querySelector('.swrow[data-i="' + m[1] + '"]');
    if(row){ hit = true; clearInterval(t); pickStop(row); }
  }, 250);
  setTimeout(function(){ clearInterval(t); }, 9000);
})();

/* 调试用：地址加 ?autoskin=d 自动点一下那个配色，验证「换了就记住」整条链路 */
(function(){
  var m = location.search.match(/[?&]autoskin=([cde])/);
  if(!m) return;
  setTimeout(function(){ try{ setSkin(m[1]); }catch(e){} }, 2200);
})();
